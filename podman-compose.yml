services:
  backend:
    build:
      context: .
      dockerfile: Containerfile
    image: localhost/orpheus-backend:latest
    container_name: orpheus-backend
    environment:
      DB_PATH: /app/data/orpheus.db
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      FAILURE_THRESHOLD: ${FAILURE_THRESHOLD:-3}
    volumes:
      - orpheus-data:/app/data
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./dashboard
      dockerfile: Containerfile
    image: localhost/orpheus-frontend:latest
    container_name: orpheus-frontend
    ports:
      - "${FRONTEND_PORT:-8082}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  orpheus-data:
